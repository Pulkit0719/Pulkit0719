name: Generate Pacman Animation

on:
  schedule:
    # Run once daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate Pac-Man Contribution Graph
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Pac-Man Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Commit to main branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase
          mkdir -p output
          cp dist/pacman* output/ 2>/dev/null || true
          git add dist/ output/
          git commit -m "Update Pac-Man Contribution Visualization" || echo "No changes to commit"
          git push origin main || echo "Push to main skipped or up to date"

      - name: Push to pacman branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}