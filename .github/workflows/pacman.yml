name: Generate pacman animation

on:
  schedule:
    # Run twice daily at 02:00 and 14:00 UTC
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate pacman-contribution-graph.svg
    permissions:
      contents: write  # Needed to commit generated files
    steps:
      - uses: actions/checkout@v4
      - name: Generate Pac-Man Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_username: ${{ github.repository_owner }}
          # Output file
          output: dist/pacman-contribution-graph.svg
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dist/
          git commit -m "Update Pac-Man Contribution Visualization" || echo "No changes to commit"
          git push