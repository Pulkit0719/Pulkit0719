name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # Run once daily at 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Generate GitHub Profile 3D Contrib
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D Contribution Visualizations
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase
          git add -A profile-3d-contrib/
          git commit -m "Update GitHub Profile 3D Contribution Visualization" || echo "No changes to commit"
          git push origin main || echo "Push to main skipped or up to date"