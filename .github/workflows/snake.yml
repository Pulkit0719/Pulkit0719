name: Generate Snake Game from GitHub Contribution Grid

on:
  schedule:
    # Run once daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Generate Snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-darkBlue.svg?palette=github-dark&color_snake=#388bfd
            output/github-snake.svg
            output/github-snake-dark.svg?palette=github-dark
            output/github-snake-darkBlue.svg?palette=github-dark&color_snake=#388bfd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit to main branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase
          git add dist/ output/
          git commit -m "Update GitHub Contribution Snake Visualization" || echo "No changes to commit"
          git push origin main || echo "Push to main skipped or up to date"

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}