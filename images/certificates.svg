      <text x="67" y="15" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500">Google AI Essentials</text>

      <rect x="143" width="140" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="213" y="15" text-anchor="middle" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500">Generative AI Leader</text>

      <rect x="291" width="100" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
