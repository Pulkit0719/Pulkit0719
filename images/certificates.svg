      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="436" height="226" rx="14" fill="url(#certBg)" stroke="url(#certBorder)" stroke-width="1.5" />

  <!-- Corner Icon & Header -->
  <g transform="translate(24, 24)">
    <rect width="44" height="44" rx="10" fill="#0d2e1c" stroke="#2ea043" stroke-width="1" />
    <!-- Trophy Icon -->
    <path d="M 16 16 L 28 16 L 28 22 C 28 25 25 28 22 28 C 19 28 16 25 16 22 Z" fill="#3fb950" />
    <path d="M 16 18 L 12 18 C 11 18 10 19 10 20 C 10 22 12 24 16 24" stroke="#3fb950" stroke-width="1.5" fill="none" />
    <path d="M 28 18 L 32 18 C 33 18 34 19 34 20 C 34 22 32 24 28 24" stroke="#3fb950" stroke-width="1.5" fill="none" />
    <path d="M 22 28 L 22 32" stroke="#3fb950" stroke-width="2" />
    <line x1="18" y1="32" x2="26" y2="32" stroke="#3fb950" stroke-width="2" stroke-linecap="round" />
  </g>

  <text x="80" y="42" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
