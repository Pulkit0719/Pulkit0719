<svg width="440" height="230" viewBox="0 0 440 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d" />
      <stop offset="100%" stop-color="#0e182e" />
    </linearGradient>
    <linearGradient id="eduBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.8" />
    </linearGradient>
    <filter id="eduGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="436" height="226" rx="14" fill="url(#eduBg)" stroke="url(#eduBorder)" stroke-width="1.5" />

  <!-- Corner Icon & Header -->
  <g transform="translate(24, 24)">
    <rect width="44" height="44" rx="10" fill="#0d213f" stroke="#388bfd" stroke-width="1" />
    <!-- Cap Icon -->
    <path d="M 22 14 L 34 20 L 22 26 L 10 20 Z" fill="#58a6ff" />
    <path d="M 15 23 L 15 29 C 15 32 29 32 29 29 L 29 23" stroke="#58a6ff" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 33 21 L 33 30" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <text x="80" y="42" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
    FORMAL EDUCATION
  </text>
  <text x="80" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
    B.Tech Student
  </text>

  <!-- Institution Info -->
  <g transform="translate(24, 86)">
    <text x="0" y="16" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
      Pranveer Singh Institute of Technology (PSIT)
    </text>
    <text x="0" y="34" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      📍 Kanpur, Uttar Pradesh, India
    </text>
  </g>

  <!-- Relevant Coursework Chips -->
  <g transform="translate(24, 142)">
    <text x="0" y="10" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
      Key Technical Foundation:
    </text>

    <!-- Chips Row 1 -->
    <g transform="translate(0, 20)">
      <rect width="125" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="62" y="15" text-anchor="middle" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500">Data Structures &amp; Algo</text>

      <rect x="133" width="110" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="188" y="15" text-anchor="middle" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500">Database Systems</text>

      <rect x="251" width="135" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="318" y="15" text-anchor="middle" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500">Artificial Intelligence</text>
    </g>

    <!-- Chips Row 2 -->
    <g transform="translate(0, 48)">
      <rect width="130" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="65" y="15" text-anchor="middle" fill="#ffa657" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500">Software Engineering</text>

      <rect x="138" width="120" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="198" y="15" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500">Web Technologies</text>
    </g>
  </g>
</svg>