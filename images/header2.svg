<svg width="100%" height="auto" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090f1d" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2ea043" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e6edf3" />
      <stop offset="70%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="slightGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#388bfd" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="40" cy="0" r="1.5" fill="#58a6ff" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }
    @keyframes slideGradient {
      0% { stop-color: #388bfd; }
      50% { stop-color: #3fb950; }
      100% { stop-color: #388bfd; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes sweepLine {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }

    .border-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .cursor { animation: blinkCursor 1s infinite; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="60" r="140" fill="#388bfd" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="260" r="160" fill="#2ea043" opacity="0.07" filter="url(#glow)" />

  <!-- Top Decorative Circuit Lines -->
  <g opacity="0.4" class="particle-1">
    <path d="M 60 40 L 220 40 L 260 80 L 400 80" stroke="#388bfd" stroke-width="1.5" fill="none" stroke-dasharray="4 4" />
    <circle cx="60" cy="40" r="3" fill="#58a6ff" />
    <circle cx="400" cy="80" r="3" fill="#3fb950" />
  </g>
  <g opacity="0.4" class="particle-2">
    <path d="M 1140 280 L 980 280 L 940 240 L 800 240" stroke="#2ea043" stroke-width="1.5" fill="none" stroke-dasharray="4 4" />
    <circle cx="1140" cy="280" r="3" fill="#3fb950" />
    <circle cx="800" cy="240" r="3" fill="#58a6ff" />
  </g>

  <!-- Sleek Glowing Outer Border -->
  <rect x="3" y="3" width="1194" height="314" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" class="border-glow" />

  <!-- Status Pill Badge -->
  <g transform="translate(60, 48)">
    <rect width="250" height="28" rx="14" fill="#0d1f38" stroke="#388bfd" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="14" r="4.5" fill="#3fb950" filter="url(#slightGlow)" />
    <circle cx="16" cy="14" r="2.5" fill="#ffffff" />
    <text x="30" y="18" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">
      SOFTWARE ENGINEER • AI DEV
    </text>
  </g>

  <!-- Terminal Indicator / Corner Badge -->
  <g transform="translate(1030, 48)">
    <rect width="110" height="28" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="14" r="3.5" fill="#ff5f56" />
    <circle cx="30" cy="14" r="3.5" fill="#ffbd2e" />
    <circle cx="44" cy="14" r="3.5" fill="#27c93f" />
    <text x="60" y="18" fill="#8b949e" font-family="'Courier New', monospace" font-size="11" font-weight="600">
      main.py
    </text>
  </g>

  <!-- Central Title: PULKIT PORWAL -->
  <text x="60" y="145" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">
    PULKIT PORWAL
  </text>

  <!-- Verified Icon Badge -->
  <g transform="translate(540, 108)">
    <circle cx="14" cy="14" r="12" fill="#1f6feb" fill-opacity="0.3" />
    <circle cx="14" cy="14" r="9" fill="#388bfd" />
    <path d="M 10 14 L 13 17 L 19 10" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Subtitle Line -->
  <text x="60" y="188" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500">
    <tspan fill="#58a6ff" font-weight="600">Python Developer</tspan>
    <tspan fill="#484f58"> │ </tspan>
    <tspan fill="#3fb950" font-weight="600">AI &amp; Full-Stack Development</tspan>
    <tspan fill="#484f58"> │ </tspan>
    <tspan fill="#e6edf3">B.Tech Student</tspan>
  </text>

  <!-- Command Prompt / Focus Line -->
  <g transform="translate(60, 222)">
    <text x="0" y="0" fill="#388bfd" font-family="'Fira Code', 'Courier New', monospace" font-size="14" font-weight="600">
      pulkit@dev:~$
    </text>
    <text x="120" y="0" fill="#7ee787" font-family="'Fira Code', 'Courier New', monospace" font-size="14">
      building intelligent systems &amp; modern scalable applications
    </text>
    <rect x="645" y="-12" width="8" height="15" fill="#58a6ff" class="cursor" />
  </g>

  <!-- Bottom Interactive Tech Badges -->
  <g transform="translate(60, 252)">
    <!-- Badge 1: Python -->
    <g transform="translate(0, 0)">
      <rect width="90" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="45" y="17" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Python 3</text>
    </g>
    <!-- Badge 2: GenAI & LLMs -->
    <g transform="translate(100, 0)">
      <rect width="130" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="65" y="17" text-anchor="middle" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">GenAI &amp; Agents</text>
    </g>
    <!-- Badge 3: React / Next.js -->
    <g transform="translate(240, 0)">
      <rect width="120" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="60" y="17" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">React • Next.js</text>
    </g>
    <!-- Badge 4: TypeScript -->
    <g transform="translate(370, 0)">
      <rect width="105" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="52" y="17" text-anchor="middle" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">TypeScript</text>
    </g>
    <!-- Badge 5: Node.js & APIs -->
    <g transform="translate(485, 0)">
      <rect width="125" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="62" y="17" text-anchor="middle" fill="#56d364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Node.js &amp; APIs</text>
    </g>
    <!-- Badge 6: PSIT Kanpur -->
    <g transform="translate(620, 0)">
      <rect width="120" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="60" y="17" text-anchor="middle" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">PSIT Kanpur</text>
    </g>
  </g>

  <!-- Right Decorative Icon / Branding Visual -->
  <g transform="translate(970, 110)" class="particle-3">
    <!-- Outer Hexagon / Tech Rings -->
    <circle cx="80" cy="80" r="65" fill="none" stroke="#388bfd" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 6" />
    <circle cx="80" cy="80" r="50" fill="#0d1f38" stroke="#2ea043" stroke-width="1.5" stroke-opacity="0.5" />
    <!-- Center Code Icon -->
    <path d="M 65 72 L 53 80 L 65 88" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 95 72 L 107 80 L 95 88" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="84" y1="68" x2="76" y2="92" stroke="#e6edf3" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>