<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#grad8)" />

  <!-- Programming (Python primary) -->
  <circle cx="60" cy="60" r="25" fill="#ffd43b" />
  <text x="60" y="65" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Py
  </text>

  <!-- AI/GenAI -->
  <circle cx="180" cy="60" r="25" fill="#fd79a8" />
  <text x="180" y="65" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
    AI
  </text>

  <!-- Frontend -->
  <circle cx="300" cy="60" r="25" fill="#00b894" />
  <text x="300" y="65" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
    Web
  </text>

  <!-- Databases -->
  <circle cx="60" cy="180" r="25" fill="#e17055" />
  <text x="60" y="185" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
    DB
  </text>

  <!-- Cloud -->
  <circle cx="180" cy="180" r="25" fill="#636e72" />
  <text x="180" y="185" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
    Cloud
  </text>

  <!-- DevOps/Tools -->
  <circle cx="300" cy="180" r="25" fill="#fdcb6e" />
  <text x="300" y="185" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
    Dev
  </text>

  <!-- Labels -->
  <text x="60" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Programming
  </text>
  <text x="180" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    AI/GenAI
  </text>
  <text x="300" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Frontend
  </text>
  <text x="60" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Databases
  </text>
  <text x="180" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Cloud
  </text>
  <text x="300" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    DevOps/Tools
  </text>
</svg>